[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-lab"
version = "0.1.0"
description = "Reproducible Qwen inference benchmarking, quantization, plotting, and profiling"
requires-python = ">=3.9"
dependencies = [
  "accelerate>=0.30",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "psutil>=5.9",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43"]
test = ["pytest>=8"]

[project.scripts]
llm-lab = "llm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

